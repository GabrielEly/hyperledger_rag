version: '3.8'

services:
  # Aplicação RAG Principal
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hyperledger-rag-api
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
      WORKERS: 4
      LOG_LEVEL: INFO
      CACHE_BACKEND: memory
      API_KEY_REQUIRED: "true"
      API_KEYS: sk-rag-demo-key-123,sk-rag-prod-key-456
    volumes:
      - ./faiss_index_v2:/app/faiss_index_v2
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  rag-network:
    driver: bridge
